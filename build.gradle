plugins {
    id 'java'
    id 'application'
    id 'com.petwal.docker'
    id 'com.petwal.spotless-convention'
}

group = 'com.petwal'
version = '0.1'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

application {
    mainClass = 'com.petwal.Main'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation libs.guava

    testImplementation platform(libs.junit.bom)
    testImplementation libs.junit.jupiter
}

jar {
    manifest {
        attributes('Main-Class': 'com.petwal.Main')
    }
}

test {
    useJUnitPlatform()
}
